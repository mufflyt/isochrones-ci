name: Nightly

# TIER B: the serious battery. Everything the PR gate runs, plus the randomized
# sweep, the adversarial corpus, the metamorphic layer and the mutation tests --
# across an R version matrix.
#
# Depth beats runtime here. This repository exists to test; a nightly that takes
# 40 minutes and tries hard is worth far more than one that takes 4 and does not.
#
# SCHEDULE: 08:20 UTC = 02:20 America/Denver (MDT, UTC-6) / 01:20 (MST, UTC-7).
# The :20 offset is deliberate -- starting on the hour puts every repository in
# the account into the same GitHub scheduling queue, and scheduled runs are
# already best-effort.

on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false   # never cancel a nightly halfway; a partial nightly
                              # is exactly the truncated run this repo distrusts

permissions:
  contents: read

env:
  PRODUCTION_REPO: mufflyt/mufflyaccess
  PRODUCTION_REF: main
  RENV_CONFIG_AUTOLOADER_ENABLED: "false"

jobs:
  battery:
    name: full battery (R ${{ matrix.r }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false        # one R version failing must not hide the others
      matrix:
        r: ['release', 'oldrel-1']
    env:
      # A different seed per night, derived from the run number, so the harness
      # explores new worlds over time -- and the seed is printed in the summary
      # and saved in the artifact, so any failure is reproducible exactly.
      HARNESS_SEED: ${{ github.run_number }}
      HARNESS_RANDOM_WORLDS: "200"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::sf, any::yaml, any::withr, any::digest
          dependencies: '"hard"'

      - name: Resolve and record the production SHA
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote "https://github.com/${PRODUCTION_REPO}.git" "${PRODUCTION_REF}" | cut -f1)"
          [ -n "$sha" ] || { echo "::error::cannot resolve ${PRODUCTION_REPO}@${PRODUCTION_REF}"; exit 1; }
          echo "PRODUCTION_SHA=$sha" >> "$GITHUB_ENV"

      # Record the environment BEFORE anything that can fail, so an early
      # failure still produces a downloadable artifact. Without this the upload
      # step (deliberately if-no-files-found: error) fails on top of the real
      # failure and buries it.
      - name: Record the environment
        if: always()
        shell: Rscript {0}
        run: |
          dir.create("artifacts", showWarnings = FALSE, recursive = TRUE)
          writeLines(utils::capture.output(utils::sessionInfo()), "artifacts/sessionInfo.txt")
          writeLines(c(paste0("production_repo=", Sys.getenv("PRODUCTION_REPO")),
                       paste0("production_ref=", Sys.getenv("PRODUCTION_REF")),
                       paste0("production_sha=", Sys.getenv("PRODUCTION_SHA")),
                       paste0("r_version=", as.character(getRversion())),
                       paste0("seed=", Sys.getenv("HARNESS_SEED")),
                       paste0("random_worlds=", Sys.getenv("HARNESS_RANDOM_WORLDS"))),
                     "artifacts/run-parameters.txt")

      - name: Install production at the resolved SHA
        shell: Rscript {0}
        env:
          # remotes reads the GitHub API to fetch DESCRIPTION. Unauthenticated
          # that request is rate-limited and failed outright on the first run
          # ("cannot open URL .../contents/DESCRIPTION"). GITHUB_TOKEN is
          # read-only and is the right credential here; no PAT is involved, and
          # nothing secret is exposed to fork code.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pak, not remotes. remotes::install_github() did not pull production's
          # own CRAN dependencies on the oldrel-1 runner and R CMD INSTALL died
          # with "dependency 'stringr' is not available". pak resolves the full
          # dependency graph, including system requirements, and is already
          # present from setup-r-dependencies.
          #
          # Fail closed either way: install.packages() only WARNS on failure, so
          # without the requireNamespace() check a missing production package
          # would sail through to a run that skips every cross-check and reports
          # green -- the precise false signal this harness exists to prevent.
          pkg <- sub("^.*/", "", Sys.getenv("PRODUCTION_REPO"))
          pak::pkg_install(
            paste0(Sys.getenv("PRODUCTION_REPO"), "@", Sys.getenv("PRODUCTION_SHA")),
            ask = FALSE)
          if (!requireNamespace(pkg, quietly = TRUE)) {
            stop("production package '", pkg, "' failed to install; refusing to run ",
                 "a harness that would skip every cross-check and report green")
          }
          cat("installed", pkg, as.character(utils::packageVersion(pkg)), "\n")

      - name: Run the full battery
        run: Rscript scripts/run-ci.R

      - name: Verify test accounting
        if: always()
        run: Rscript scripts/verify-test-accounting.R

      # VALUES, not bytes. A `git diff` after regeneration answers "did R format
      # these doubles identically", which is not the claim being made and is not
      # true across R versions -- the first real nightly failed exactly that way
      # on travel_times.csv, the file with the most doubles. This asks whether
      # the generator still produces the committed numbers, and prints the worst
      # deviation so ~1e-15 (formatting) is never confused with a real
      # determinism problem.
      - name: Verify fixtures still reproduce from their seed
        if: always()
        run: Rscript scripts/check-fixture-drift.R

      - name: Confirm the suite left the tree unmodified
        if: always()
        run: |
          dirty="$(git status --porcelain --untracked-files=no)"
          if [ -n "$dirty" ]; then
            echo "::error title=Suite mutated tracked files::a test wrote into the repository"
            echo "$dirty"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-${{ matrix.r }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
