name: PR

# TIER A: the fast gate. Deterministic tests only, no randomized sweep, no
# mutation layer. Target is a strong smoke/science gate in a couple of minutes,
# not the whole nightly battery.
#
# A PR must never appear green because the runner exited early. The completion
# sentinel and the separate accounting verification are what enforce that.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. This workflow reads code and uploads artifacts; it needs
# nothing else, and a public repo running PR code must not hold write
# credentials. `pull_request` (not `pull_request_target`) is deliberate: fork
# code runs without access to secrets.
permissions:
  contents: read

env:
  # The production commit under test. Pinned so a run is reproducible; the
  # nightly and manual workflows can override it.
  PRODUCTION_REPO: mufflyt/mufflyaccess
  PRODUCTION_REF: main
  HARNESS_SEED: "20260816"
  HARNESS_RANDOM_WORLDS: "10"
  # HALL_OF_SHAME lesson carried over from isochrones: without this the project
  # .Rprofile can activate renv, whose source-only repos shadow use-public-rspm
  # and turn a 3-minute job into a 90-minute source build.
  RENV_CONFIG_AUTOLOADER_ENABLED: "false"

jobs:
  gate:
    name: science gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::sf, any::yaml, any::withr, any::digest, any::here, any::stringr, any::stringdist, any::stringi
          dependencies: '"hard"'

      # Resolve the production commit BEFORE installing it, and record it. A
      # result that cannot name the commit it tested is not reproducible.
      - name: Resolve and record the production SHA
        id: prod
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote "https://github.com/${PRODUCTION_REPO}.git" "${PRODUCTION_REF}" | cut -f1)"
          if [ -z "$sha" ]; then
            echo "::error title=Cannot resolve production ref::${PRODUCTION_REPO}@${PRODUCTION_REF}"
            exit 1
          fi
          echo "PRODUCTION_SHA=$sha" >> "$GITHUB_ENV"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "testing ${PRODUCTION_REPO}@${sha}"

      # Record the environment BEFORE anything that can fail, so an early
      # failure still produces a downloadable artifact. Without this the upload
      # step (deliberately if-no-files-found: error) fails on top of the real
      # failure and buries it.
      - name: Record the environment
        if: always()
        shell: Rscript {0}
        run: |
          dir.create("artifacts", showWarnings = FALSE, recursive = TRUE)
          writeLines(utils::capture.output(utils::sessionInfo()), "artifacts/sessionInfo.txt")
          writeLines(c(paste0("production_repo=", Sys.getenv("PRODUCTION_REPO")),
                       paste0("production_ref=", Sys.getenv("PRODUCTION_REF")),
                       paste0("production_sha=", Sys.getenv("PRODUCTION_SHA")),
                       paste0("r_version=", as.character(getRversion())),
                       paste0("seed=", Sys.getenv("HARNESS_SEED")),
                       paste0("random_worlds=", Sys.getenv("HARNESS_RANDOM_WORLDS"))),
                     "artifacts/run-parameters.txt")

      - name: Install production at the resolved SHA
        shell: Rscript {0}
        env:
          # remotes reads the GitHub API to fetch DESCRIPTION. Unauthenticated
          # that request is rate-limited and failed outright on the first run
          # ("cannot open URL .../contents/DESCRIPTION"). GITHUB_TOKEN is
          # read-only and is the right credential here; no PAT is involved, and
          # nothing secret is exposed to fork code.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pak, not remotes. remotes::install_github() did not pull production's
          # own CRAN dependencies on the oldrel-1 runner and R CMD INSTALL died
          # with "dependency 'stringr' is not available". pak resolves the full
          # dependency graph, including system requirements, and is already
          # present from setup-r-dependencies.
          #
          # Fail closed either way: install.packages() only WARNS on failure, so
          # without the requireNamespace() check a missing production package
          # would sail through to a run that skips every cross-check and reports
          # green -- the precise false signal this harness exists to prevent.
          pkg <- sub("^.*/", "", Sys.getenv("PRODUCTION_REPO"))
          pak::pkg_install(
            paste0(Sys.getenv("PRODUCTION_REPO"), "@", Sys.getenv("PRODUCTION_SHA")),
            ask = FALSE)
          if (!requireNamespace(pkg, quietly = TRUE)) {
            stop("production package '", pkg, "' failed to install; refusing to run ",
                 "a harness that would skip every cross-check and report green")
          }
          cat("installed", pkg, as.character(utils::packageVersion(pkg)), "\n")

      - name: Run the science gate
        run: Rscript scripts/run-ci.R --tier=pr

      # Separate step, always runs. "Did it finish" and "did it pass" must stay
      # independent signals.
      - name: Verify test accounting
        if: always()
        run: Rscript scripts/verify-test-accounting.R

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-artifacts-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
